# Part 0.7: restrict discovery so a bare `pytest` can never collect
# tests/full_scan_test.py (matches pytest's default `*_test.py` pattern and
# fires a live Finviz + yfinance scan on import). Only tests/test_*.py are
# collected. The live scripts stay runnable by naming them explicitly.
[pytest]
testpaths = tests
python_files = test_*.py
